name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity.
# This sends one tiny read request every day (public data only, using the public key already in .env.production).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          set -a; . ./.env.production; set +a
          curl -fsS "$VITE_SUPABASE_URL/rest/v1/yd_site_config?select=show_rabbi_login" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY"
